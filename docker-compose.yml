services:
  postgres_keycloak:
    image: postgres:16
    container_name: postgres_keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      postgres_keycloak:
        condition: service_healthy
    networks:
      - app-net

  postgres_app:
    image: postgres:16
    container_name: postgres_app
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net

  mongo_express:
    image: mongo-express
    container_name: mongo_express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_started
    networks:
      - app-net

  backend:
    build: ./backend
    container_name: backend
    working_dir: /app
    command: ["./server"]
    environment:
      APP_POSTGRES_DSN: postgres://app:app@postgres_app:5432/app?sslmode=disable
      APP_MONGO_URI: mongodb://mongo:27017
      APP_KEYCLOAK_URL: http://keycloak:8080
      APP_KEYCLOAK_REALM: master
      APP_KEYCLOAK_CLIENT_ID: backend
      APP_KEYCLOAK_CLIENT_SECRET: backend-secret
    ports:
      - "9000:9000"
    depends_on:
      postgres_app:
        condition: service_healthy
      keycloak:
        condition: service_started
      mongo:
        condition: service_started
    networks:
      - app-net

volumes:
  postgres_keycloak_data:
  postgres_app_data:
  mongo_data:

networks:
  app-net:
    driver: bridge
