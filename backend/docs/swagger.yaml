basePath: /
definitions:
  handlers.AdminPingResponse:
    properties:
      message:
        example: admin pong
        type: string
    type: object
  handlers.AdminStatsResponse:
    properties:
      activeOrders:
        example: 12
        type: integer
      totalRevenue:
        example: 1450.5
        type: number
      totalUsers:
        example: 154
        type: integer
    type: object
  handlers.UserProfileResponse:
    properties:
      email:
        example: user@artofino.com
        type: string
      firstName:
        example: John
        type: string
      id:
        example: 4321-abcd-1234
        type: string
      lastName:
        example: Doe
        type: string
      username:
        example: johndoe
        type: string
    type: object
host: localhost:9000
info:
  contact: {}
  description: Backend service for ArtoFino platform.
  title: ArtoFino Backend API
  version: "1.0"
paths:
  /admin/ping:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AdminPingResponse'
      security:
      - BearerAuth: []
      summary: Admin ping
      tags:
      - admin
  /admin/stats:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AdminStatsResponse'
      security:
      - BearerAuth: []
      summary: Admin stats
      tags:
      - admin
  /hc:
    get:
      description: Returns OK if service is alive
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
      tags:
      - system
  /lc:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: ALIVE
          schema:
            type: string
      summary: Liveness check
      tags:
      - system
  /rc:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: READY
          schema:
            type: string
        "503":
          description: NOT READY
          schema:
            type: string
      summary: Readiness check
      tags:
      - system
  /users/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserProfileResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer <token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
