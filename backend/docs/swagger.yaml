basePath: /
definitions:
  handlers.BuyShareInput:
    properties:
      objectId:
        example: 64a7b3e1f1d2c3a4b5777777
        type: string
      sharePct:
        example: 5
        maximum: 10
        minimum: 1
        type: number
    required:
    - objectId
    - sharePct
    type: object
  handlers.CreateObjectInput:
    properties:
      artistId:
        example: artist-uuid-111
        type: string
      basePrice:
        example: 5000
        type: number
      currency:
        example: EUR
        type: string
      dailyGrowthRate:
        example: 0.00025
        type: number
      description:
        example: An incredible modern oil canvas exploration.
        type: string
      tags:
        example:
        - '[''oil'''
        - ' ''canvas'''
        - ' ''modern'']'
        items:
          type: string
        type: array
      title:
        example: Symphony of Lights
        type: string
    required:
    - artistId
    - basePrice
    - currency
    - dailyGrowthRate
    - title
    type: object
  handlers.CreatorApplicationInput:
    properties:
      bio:
        example: Contemporary oil painter based in Prague, focusing on urban landscapes.
        maxLength: 500
        type: string
      portfolioUrl:
        example: https://behance.net/my-art-portfolio
        type: string
      socialLinks:
        example:
        - '[''https://instagram.com/artist_handle'']'
        items:
          type: string
        type: array
    required:
    - bio
    - portfolioUrl
    - socialLinks
    type: object
  handlers.CreatorApplicationResponse:
    properties:
      applicationId:
        example: app-111222
        type: string
      bio:
        type: string
      createdAt:
        type: string
      portfolioUrl:
        type: string
      status:
        description: pending, approved, rejected
        example: pending
        type: string
      userId:
        example: user-keycloak-uuid
        type: string
    type: object
  handlers.TransactionResponse:
    properties:
      amountPaid:
        example: 253.75
        type: number
      buyerId:
        example: user-buyer-uuid
        type: string
      createdAt:
        type: string
      currency:
        example: EUR
        type: string
      objectId:
        example: 64a7b3e1f1d2c3a4b5777777
        type: string
      sellerId:
        example: artist-seller-uuid
        type: string
      sharePct:
        example: 5
        type: number
      transactionId:
        example: uuid-string-here
        type: string
    type: object
  handlers.TransferApprovalResponse:
    properties:
      approvedAt:
        type: string
      status:
        example: approved
        type: string
      transferId:
        example: tr-888999
        type: string
    type: object
  handlers.TransferRequestInput:
    properties:
      durationDays:
        example: 7
        minimum: 1
        type: integer
      eventDetails:
        example: Corporate pop-up exhibition or apartment art party
        type: string
      objectId:
        example: 64a7b3e1f1d2c3a4b5
        type: string
    required:
    - durationDays
    - eventDetails
    - objectId
    type: object
  handlers.TransferRequestResponse:
    properties:
      createdAt:
        type: string
      eventDetails:
        example: Corporate pop-up exhibition or apartment art party
        type: string
      expiresAt:
        type: string
      fromHolderId:
        example: partner-current-owner-uuid
        type: string
      objectId:
        example: 64a7b3e1f1d2c3a4b5
        type: string
      requesterId:
        example: partner-host-uuid
        type: string
      status:
        description: pending, approved, rejected, completed
        example: pending
        type: string
      transferId:
        example: tr-999111
        type: string
    type: object
  handlers.UserProfileResponse:
    properties:
      email:
        example: user@artofino.com
        type: string
      firstName:
        example: John
        type: string
      id:
        example: 4321-abcd-1234
        type: string
      lastName:
        example: Doe
        type: string
      username:
        example: johndoe
        type: string
    type: object
  mongo.Object:
    properties:
      basePrice:
        type: number
      createdAt:
        type: string
      currency:
        type: string
      currentHolderId:
        type: string
      dailyGrowthRate:
        type: number
      description:
        type: string
      id:
        type: string
      ownerUserId:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:9000
info:
  contact: {}
  description: Backend service for ArtoFino platform.
  title: ArtoFino Backend API
  version: "1.0"
paths:
  /admin/objects:
    post:
      consumes:
      - application/json
      description: Allows administrators to mint a new digital art object metadata
        entry inside MongoDB with base pricing configuration.
      parameters:
      - description: Art Object configuration state
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateObjectInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/mongo.Object'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new art object asset
      tags:
      - admin
  /authors/apply:
    post:
      consumes:
      - application/json
      description: Allows a registered user to submit portfolio and social links to
        get vetted and upgraded to the 'artist' role.
      parameters:
      - description: Artist application data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.CreatorApplicationInput'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handlers.CreatorApplicationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Apply for Artist (Creator) status
      tags:
      - authors
  /hc:
    get:
      description: Returns OK if service is alive
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
      tags:
      - system
  /lc:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: ALIVE
          schema:
            type: string
      summary: Liveness check
      tags:
      - system
  /rc:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: READY
          schema:
            type: string
        "503":
          description: NOT READY
          schema:
            type: string
      summary: Readiness check
      tags:
      - system
  /transactions/buy:
    post:
      consumes:
      - application/json
      description: Purchase a fractional percentage of an art object. Price is locked
        and calculated dynamically using the live growth formula from MongoDB.
      parameters:
      - description: Purchase percentage details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.BuyShareInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Buy a share in an art object
      tags:
      - transactions
  /transfers/{id}/approve:
    post:
      description: Allows the current holder or owner of the art object to approve
        a pending temporary transfer request.
      parameters:
      - description: Transfer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TransferApprovalResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve a physical transfer request
      tags:
      - transfers
  /transfers/request:
    post:
      consumes:
      - application/json
      description: Allows a Partner to apply for hosting an art object at their event/location.
      parameters:
      - description: Transfer request details
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.TransferRequestInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TransferRequestResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Request art object for temporary use
      tags:
      - transfers
  /users/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserProfileResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer <token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
